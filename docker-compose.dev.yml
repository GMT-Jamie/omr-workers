# 開發用的 override。**只在開發機上用**（Win11 → WSL2 → Ubuntu 24.04 + 純 docker
# engine，**沒有 Docker Desktop**；理由與實裝版本見 TODO.md 的 M1）。
#
#   # 在 WSL 裡面跑，不是 Git Bash：含中文的路徑當參數傳給 wsl.exe 會編碼壞掉
#   cd "/mnt/c/path/to/omr-workers"
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# 它做兩件正式組態刻意不做的事：把 port 映射到 host（smoke_test.sh 要打得到），
# 以及讓容器連得到外網（`internal: true` 的網路連 host 都到不了，而 build 完之後
# 開發時偶爾需要進容器裝東西除錯）。

services:
  audiveris-worker:
    ports:
      # 只綁 127.0.0.1 —— 綁 0.0.0.0 等於把一個沒有認證、整段佔用 CPU 的端點
      # 掛到同網段所有人面前。
      #
      # ⚠️ **8081 是站台設定裡寫的那個 port**（appsettings 的 Omr:WorkerUrl）。
      # 兩個 worker 共用它是刻意的：切換引擎不必動站台的設定，只要換啟動哪一個。
      - "127.0.0.1:8081:8080"
    networks: [omr-internal, omr-dev]

  # 備選引擎。只有 `--profile fallback` 時才會起來（見 docker-compose.yml）。
  # ⚠️ 它跟 audiveris-worker **搶同一個 8081** —— 兩個一起跑會撞 port，那是刻意的：
  # 站台同時只該連到一個引擎。
  homr-worker:
    ports:
      - "127.0.0.1:8081:8080"
    networks: [omr-internal, omr-dev]

networks:
  omr-dev:
    internal: false
