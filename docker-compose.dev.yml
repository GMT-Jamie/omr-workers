# 開發用的 override。**只在開發機上用**（Win11 → WSL2 → Ubuntu 24.04 + 純 docker
# engine，**沒有 Docker Desktop** —— 純 engine 跟正式機同形狀，不會出現
# 「開發機用 Desktop 驗綠、正式機沒 Desktop 又踩一次」）。
#
#   # 在 WSL 裡面跑，不是 Git Bash：含中文的路徑當參數傳給 wsl.exe 會編碼壞掉
#   cd /mnt/c/path/to/omr-workers
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# ⚠️ **`ports` 在 compose 裡預設是相加的，不是覆寫的。** base 已經有一條
# `${OMR_BIND:-127.0.0.1}:8081:8080`，這裡再寫一條普通的就是同一個 port 綁兩次
# → 啟動失敗。所以用 `!override`（取代整個屬性），不是 `!reset`（那是清空）。

services:
  audiveris-worker:
    # 開發機沒有 .env，base 的 OMR_BIND 本來就會退回 127.0.0.1 —— 結果一樣。
    # 明寫出來是為了讓「開發機只綁 loopback」成為讀得到的事實，而不是預設值的副作用。
    ports: !override
      - "127.0.0.1:8081:8080"

  # 備選引擎。只有 `--profile fallback` 時才會起來（見 docker-compose.yml）。
  # ⚠️ 它跟 audiveris-worker **搶同一個 8081** —— 兩個一起跑會撞 port，那是刻意的：
  # 站台同時只該連到一個引擎。
  homr-worker:
    ports: !override
      - "127.0.0.1:8081:8080"
