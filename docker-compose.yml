# 正式用的組態。**不對外開任何 port。**
#
# 拓樸（spec §6/§7 假設呼叫端也在同一份 compose 裡，實際不是，所以邊界往外移了
# 一層。完整說明見 README 的〈部署拓樸〉）：
#
#   瀏覽器 ──HTTPS──> IIS / Windows Server 2019（站台，薄代理）
#                        │
#                        │ Hyper-V Internal Switch（只通 host ↔ VM，VM 連不到外網）
#                        ▼
#                     Linux VM ── docker compose
#                        ├── audiveris-worker  ← 主引擎
#                        └── homr-worker       ← 備選，預設不啟動
#
# Server 2019 **跑不了 Linux 容器**（WSL2 從 Server 2022 才支援、Docker Desktop
# 不支援任何 Windows Server、LCOW 已移除），所以容器住在同一台機器上的 Hyper-V
# Linux VM 裡。用 Internal Switch 而不是 External/NAT：那種 switch 只通 host ↔ VM，
# 於是「runtime 無 outbound 網路」是 hypervisor 層級的保證，比 compose 設定更強。
#
# build 需要外網（audiveris 抓 .deb 與 OCR 語言資料、`homr --init` 抓 GitHub
# releases），所以流程是
# 「開 External switch → build → 換回 Internal switch → 跑」。

services:
  # ─── 主引擎 ───
  #
  # **audiveris 是現在實際在用的那一個**（決定於 2026-08-24）。同一批三頁鋼琴譜、
  # 同一支量測工具的實測：
  #
  #                    homr            audiveris
  #   壞小節           28/66 (42%)     19/66 (29%)
  #   連音             0（引擎刪了 11 個小節）  5 保留
  #   譜上的速度記號   讀不到          ♩=179 讀到了
  #   單頁（4 核）     95.9 秒         4.1 秒
  #   單頁（24 核）    13.9 秒         4.6 秒
  #   image           1.51 GB         803 MB
  #   PDF             ✗               ✓
  #
  # ⚠️ **audiveris 幾乎不吃平行度**（24 核 4.6 秒、4 核 4.1 秒、2 核 5.2 秒），
  # 所以它不需要 homr 那種核心數。正式機的 vCPU 因此可以訂得低很多。
  audiveris-worker:
    build: ./audiveris-worker
    environment:
      JOB_TIMEOUT_SEC: "600"
      MAX_CONCURRENCY: "1"
      MAX_UPLOAD_MB: "20"
    ports:
      # ⚠️ **綁在 VM 的內部 switch 位址上，不要綁 0.0.0.0。**
      #
      # 正式機跑起來時 VM 只有內部 switch 那張網卡，所以 0.0.0.0 看起來也安全 ——
      # 但**裝 docker 與 build image 的那個階段是接 External switch 的**，
      # 那時候 0.0.0.0 等於把一個沒有認證的端點掛到公司網段上。
      #
      # 值放在 VM 上的 `.env`（不進版控）：
      #     OMR_BIND=192.168.x.x        # VM 在內部 switch 上的位址
      # 沒設的話退回 127.0.0.1 —— **寧可連不到也不要意外對外**。連不到的症狀很吵
      # （代理回 UNREACHABLE），對外曝光的症狀是沒有症狀。
      - "${OMR_BIND:-127.0.0.1}:8081:8080"
    networks: [omr-internal]
    deploy:
      resources:
        limits:
          # JVM 一個行程。spec 原本猜 -Xmx5g，但實測單頁只要 4 秒而且沒有調過堆積
          # 大小 —— 先給 2 GB，OOM 的話再往上調（OOM 被 killer 殺掉的症狀是容器
          # 無聲重啟，比慢難查太多，所以寧可寬鬆）。
          memory: 2g
          # 給 2 顆就夠：實測 2 核 5.2 秒、4 核 4.1 秒、24 核 4.6 秒 —— 曲線是平的。
          cpus: "2"
    read_only: true
    tmpfs:
      # Audiveris 會往 $HOME 底下寫設定與快取，而 Dockerfile 把 HOME 指到這裡。
      # exec 的理由同 homr-worker：JNA 會把 .so 解到快取再 dlopen。
      - /tmp:exec,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  # ─── 備選引擎（目前停用）───
  #
  # 留著不刪：homr 的宣稱強項是**手機拍攝**，而我們到現在**一張手機拍的譜都沒有**，
  # 所以那個問題還沒有證據可判。上面那組數字全部來自乾淨數位排版
  # 的譜 —— 那正好是 audiveris 的主場、homr 的弱項。
  #
  # 要啟用：把下面的 profiles 那兩行拿掉，或跑
  #   docker compose --profile fallback up -d
  homr-worker:
    profiles: ["fallback"]
    build: ./homr-worker
    environment:
      JOB_TIMEOUT_SEC: "600"
      MAX_CONCURRENCY: "1"
      MAX_UPLOAD_MB: "20"
    networks: [omr-internal]
    deploy:
      resources:
        limits:
          # 4 GB 是 spec §7 的數字。實測 onnxruntime 這條路比 torch 省很多，
          # 之後照 bench 的實際 RSS 調 —— 但先寬鬆，OOM 被 killer 殺掉的症狀
          # （容器無聲重啟）比慢難查太多。
          memory: 4g
          # 🔴 cpus 也是 spec §7 的數字，而它**實測代價極大**：同一張 T1.png，
          # 2 核要 ~200 秒，4 核 106 秒，8 核 54 秒，16 核 24 秒，24 核 12～13 秒。
          # 輸出完全一致（musicxml 都是 66187 字元），核心數只影響速度。
          #
          # 這**不是執行緒超額訂閱**：--cpus=2（nproc 仍看到 24）是 191 秒，改成
          # --cpuset-cpus=0-1（nproc 只看到 2）反而 218 秒。所以設 OMP_NUM_THREADS
          # 之類的旗標沒有用，唯一的變數就是給幾顆核心。
          #
          # ⚠️ **2 顆對 homr 來說是不夠的** —— 那條曲線上 2 核是約 200 秒/頁。
          # 這個值是跟著 audiveris（曲線平的那個）訂的。真的要用 homr 當主引擎，
          # 先在自己的機器上跑 bench.sh 量一次，再照上面那條曲線給核心。
          cpus: "2"
    read_only: true
    tmpfs:
      # 唯一可寫的地方。暫存圖片、輸出、與所有相依的快取都落在這裡（Dockerfile 把
      # HOME / XDG_CACHE_HOME / TMPDIR 全部指到 /tmp）。
      #
      # exec 是必要的：pip 裝的原生擴充（onnxruntime、opencv）不會從 /tmp 執行，
      # 但有些套件會把 .so 解到快取再 dlopen —— 拿掉 exec 之後那種失敗指不到成因。
      - /tmp:exec,size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

networks:
  omr-internal:
    # 🔴 **這裡刻意不是 `internal: true`，而那不是放鬆，是修正一個會讓部署白做的錯。**
    #
    # `internal: true` 的網路上**不能發佈 port，而且 docker 不報錯** —— 它照收
    # `ports:`、`docker inspect` 顯示 `Ports=map[8080/tcp:[]]`（空的），然後主機
    # 怎麼打都不通。實測過。於是 C# 代理永遠連不到 worker，而這件事只有在 VM 建好、
    # docker 裝好、image build 完之後才會發現。
    #
    # 「runtime 無 outbound 網路」這個保證改由 **Hyper-V 的 Internal switch** 提供
    # ——那本來就是 README〈部署拓樸〉選它的理由，而且**比 compose 設定更強**：
    # VM 根本沒有通往網際網路的路由，docker 的 bridge 想 MASQUERADE 也沒有出口。
    # compose 這一層的 `internal: true` 只是重複，而且跟「主機要打得到」直接衝突。
    #
    # ⚠️ 代價要講清楚：**開發機上（WSL / External switch）容器是連得到外網的。**
    # 所以「斷網下仍然能辨識」這項在開發機只能用 `docker-compose.offline.yml`
    # 模擬，真正的斷網要在正式機換成 Internal switch 之後重驗一次（已驗過）。
